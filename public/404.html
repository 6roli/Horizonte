<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Horizonte</title>
    <meta name="theme-color" content="#050608" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        padding: 4rem 1rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(40rem 22rem at 25% 0%, rgb(76 201 240 / 0.16), transparent 70%),
          radial-gradient(36rem 20rem at 80% 0%, rgb(67 97 238 / 0.2), transparent 70%),
          #050608;
        color: #f2f4f7;
        line-height: 1.6;
        min-height: 100vh;
        box-sizing: border-box;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      h1 {
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        color: #98a1b0;
      }
      a {
        display: inline-block;
        padding: 0.55rem 1.2rem;
        border-radius: 999px;
        background: #fff;
        color: #07080b;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <!-- Its presence also stops Cloudflare from answering missing files with index.html. -->
    <main>
      <h1>Page not found</h1>
      <p>This address does not exist in Horizonte.</p>
      <p><a href="/">Open the Horizonte hub</a></p>
    </main>
  </body>
</html>
