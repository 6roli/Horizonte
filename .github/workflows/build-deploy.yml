# One workflow for checks, the hourly data refresh and deployment.
#
#   push to any branch -> type check, tests, fetch live data, build, deploy
#                         (main = production, other branches = preview URL)
#   hourly schedule    -> fetch live data, build, deploy main (checks already ran on push)
#
# Cost control (private repository, GitHub Free = 2,000 Actions minutes/month):
#   the scheduled path is kept to about one billed minute, i.e. ~744 min/month.
#   Without a payment method GitHub blocks usage at the quota instead of charging.
name: Build and deploy

on:
  push:
  schedule:
    # Minute 17: EUMETView has published the :00 image by then, and it avoids the top-of-hour rush.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deployment half-way; queue the next one instead.
  cancel-in-progress: false

env:
  CLOUDFLARE_PROJECT: horizonte

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check and tests
        if: github.event_name == 'push'
        run: |
          npm run typecheck
          npm test

      - name: Fetch live Meteosat frames
        id: fetch
        continue-on-error: true
        run: npm run fetch:live

      # On a schedule, a failed fetch must not replace the last good deployment.
      # On a push, deploy anyway: the app falls back to the labelled historical sample.
      - name: Stop if scheduled refresh failed
        if: github.event_name == 'schedule' && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Live data could not be fetched; keeping the previous deployment."
          exit 1

      - name: Build
        run: npx vite build

      - name: Check for secrets in the build output
        run: |
          if grep -rIlE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'"'"'][A-Za-z0-9_\-]{16,}' dist --include='*.js' --include='*.html' --include='*.json'; then
            echo "::error::Possible secret found in build output"; exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not configured; skipping deployment."
            exit 0
          fi
          npx --yes wrangler@4.147.0 pages deploy dist \
            --project-name "$CLOUDFLARE_PROJECT" \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(git log -1 --pretty=%s | head -c 300)" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "### Deployed: ${url}" >> "$GITHUB_STEP_SUMMARY"
